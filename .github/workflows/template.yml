# Rebuilds the E2B sandbox template in E2B's cloud whenever template/ changes
# (or by hand from the Actions tab). Needs the repo secret E2B_API_KEY.
name: template
on:
  push:
    branches: [main]
    paths: ["template/**", ".github/workflows/template.yml"]
  workflow_dispatch:
    inputs:
      name:
        description: template name
        default: bridex-blender
concurrency: template
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "e2b>=2.51,<3"
      - name: build
        working-directory: template
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: python build.py "${{ inputs.name || 'bridex-blender' }}"
